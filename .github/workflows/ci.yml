name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: ShellCheck
        run: shellcheck bin/night-mode tests/run.sh
      - name: Manifest and translations are valid JSON
        run: |
          jq -e '.schemaVersion == 1 and .id and .name and .version and .kinds and .entryPoints.barWidget' manifest.json
          for f in i18n/*.json; do jq -e 'has("tooltip.dim") and has("tooltip.restore")' "$f" >/dev/null || { echo "bad $f"; exit 1; }; done
      - name: Versions agree
        run: test "$(jq -r .version manifest.json)" = "$(sed -n 's/^readonly VERSION="\(.*\)"/\1/p' bin/night-mode)"
      - name: Tests
        run: tests/run.sh
